      <path d="M256 62 238 204l18 26 18-26Z"/>
      <path d="M256 62 238 204l18 26 18-26Z" transform="rotate(60 256 256)"/>
      <path d="M256 62 238 204l18 26 18-26Z" transform="rotate(120 256 256)"/>
      <path d="M256 62 238 204l18 26 18-26Z" transform="rotate(180 256 256)"/>
      <path d="M256 62 238 204l18 26 18-26Z" transform="rotate(240 256 256)"/>
      <path d="M256 62 238 204l18 26 18-26Z" transform="rotate(300 256 256)"/>
    </g>
  </g>

  <path d="M256 176 324 215v78l-68 39-68-39v-78Z" fill="#0a1128" stroke="url(#polyllm-core)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M256 196 307 226v60l-51 30-51-30v-60Z" fill="none" stroke="rgba(34,211,238,.30)" stroke-width="4"/>
  <path d="M235 219h29c16 0 29 11 29 26s-13 26-29 26h-13v22h-16Zm16 14v24h12c8 0 13-5 13-12s-5-12-13-12Z" fill="#f7faff"/>
