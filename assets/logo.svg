<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="polyllm-logo-title">
  <title id="polyllm-logo-title">PolyLLM logo</title>
  <defs>
    <radialGradient id="polyllm-bg" cx="28%" cy="20%" r="105%">
      <stop offset="0%" stop-color="#28407f"/>
      <stop offset="52%" stop-color="#111a38"/>
      <stop offset="100%" stop-color="#070b1a"/>
    </radialGradient>
    <linearGradient id="polyllm-blade" x1="256" y1="62" x2="256" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8fb4ff"/>
      <stop offset="58%" stop-color="#5d7cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="polyllm-core" x1="185" y1="182" x2="330" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dce8ff"/>
      <stop offset="52%" stop-color="#78a5ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="polyllm-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#polyllm-bg)"/>
  <path d="M256 74 428 174v204L256 478 84 378V174Z" fill="none" stroke="rgba(143,180,255,.16)" stroke-width="5"/>

  <g filter="url(#polyllm-glow)">
