[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyllm-core"
version = "0.1.0"
description = "PolyLLM Python core: unified protocol, registry, and parameter policy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PolyLLM contributors" }]
keywords = ["llm", "polyllm", "plugins"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://polyllm.raingpt.top"
Repository = "https://github.com/you-want/PolyLLM"
Issues = "https://github.com/you-want/PolyLLM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyllm_core = ["py.typed"]
