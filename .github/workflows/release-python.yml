name: Release Python

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Python release target
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi
      confirmation:
        description: Type PUBLISH_TESTPYPI or PUBLISH_PYPI
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-python-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release operation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$OPERATION" in
            testpypi) expected="PUBLISH_TESTPYPI" ;;
            pypi) expected="PUBLISH_PYPI" ;;
            *) echo "Unknown release operation: $OPERATION" >&2; exit 1 ;;
          esac

          if [ "$CONFIRMATION" != "$expected" ]; then
            echo "Confirmation must be exactly: $expected" >&2
            exit 1
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r python/requirements-dev.txt
      - run: node scripts/verify-release-readiness.mjs --frozen
      - run: python python/version.py check
      - run: python python/verify_packages.py
      - run: python -m mypy --config-file python/mypy.ini
      - run: python python/run_tests.py
      - run: python python/build_packages.py
      - run: python -m twine check python/dist/*
      - run: python python/verify_installed_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
          if-no-files-found: error
          retention-days: 1

  publish-test:
    if: ${{ inputs.operation == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/dist

  publish:
    if: ${{ inputs.operation == 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python/dist
