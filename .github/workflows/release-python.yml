name: Release Python

on:
  workflow_dispatch:
    inputs:
      use_test_pypi:
        description: Publish to TestPyPI instead of PyPI
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r python/requirements-dev.txt
      - run: python python/version.py check
      - run: python python/verify_packages.py
      - run: python -m mypy --config-file python/mypy.ini
      - run: python python/run_tests.py
      - run: python python/build_packages.py
      - run: python -m twine check python/dist/*
      - run: python python/verify_installed_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
          if-no-files-found: error

  publish-test:
    if: ${{ github.event.inputs.use_test_pypi == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/dist

  publish:
    if: ${{ github.event.inputs.use_test_pypi != 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
