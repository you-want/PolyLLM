name: Release Python

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Python release target
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi
      package_batch:
        description: Package batch (use bootstrap-1 then bootstrap-2 for new projects)
        type: choice
        required: true
        default: all
        options:
          - all
          - bootstrap-1
          - bootstrap-2
      confirmation:
        description: Type PUBLISH_TESTPYPI or PUBLISH_PYPI
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-python-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish-matrix: ${{ steps.release-plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release operation
        id: release-plan
        env:
          OPERATION: ${{ inputs.operation }}
          PACKAGE_BATCH: ${{ inputs.package_batch }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$OPERATION" in
            testpypi) expected="PUBLISH_TESTPYPI" ;;
            pypi) expected="PUBLISH_PYPI" ;;
            *) echo "Unknown release operation: $OPERATION" >&2; exit 1 ;;
          esac

          if [ "$CONFIRMATION" != "$expected" ]; then
            echo "Confirmation must be exactly: $expected" >&2
            exit 1
          fi

          case "$PACKAGE_BATCH" in
            all)
              matrix='{"include":[{"package":"core","distribution":"polyllm_core"},{"package":"openai","distribution":"polyllm_openai"},{"package":"openai-compatible","distribution":"polyllm_openai_compatible"},{"package":"deepseek","distribution":"polyllm_deepseek"},{"package":"anthropic","distribution":"polyllm_anthropic"}]}'
              ;;
            bootstrap-1)
              matrix='{"include":[{"package":"core","distribution":"polyllm_core"},{"package":"openai","distribution":"polyllm_openai"},{"package":"openai-compatible","distribution":"polyllm_openai_compatible"}]}'
              ;;
            bootstrap-2)
              matrix='{"include":[{"package":"deepseek","distribution":"polyllm_deepseek"},{"package":"anthropic","distribution":"polyllm_anthropic"}]}'
              ;;
            *)
              echo "Unknown package batch: $PACKAGE_BATCH" >&2
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r python/requirements-dev.txt
      - run: node scripts/verify-release-readiness.mjs --frozen
      - run: python python/version.py check
      - run: python python/verify_packages.py
      - run: python -m mypy --config-file python/mypy.ini
      - run: python python/run_tests.py
      - run: python python/build_packages.py
      - run: python -m twine check python/dist/*
      - run: python python/verify_installed_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
          if-no-files-found: error
          retention-days: 1

  publish-test:
    if: ${{ inputs.operation == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.build.outputs.publish-matrix) }}
    environment: testpypi-${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
      - name: Select ${{ matrix.package }} distributions
        env:
          DISTRIBUTION_PREFIX: ${{ matrix.distribution }}
        run: |
          mkdir -p python/publish
          mapfile -t files < <(find python/dist -maxdepth 1 -type f -name "${DISTRIBUTION_PREFIX}-*" -print)

          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected exactly 2 distributions for ${DISTRIBUTION_PREFIX}, found ${#files[@]}" >&2
            exit 1
          fi

          cp "${files[@]}" python/publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/publish

  publish:
    if: ${{ inputs.operation == 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.build.outputs.publish-matrix) }}
    environment: pypi-${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: python/dist/
      - name: Select ${{ matrix.package }} distributions
        env:
          DISTRIBUTION_PREFIX: ${{ matrix.distribution }}
        run: |
          mkdir -p python/publish
          mapfile -t files < <(find python/dist -maxdepth 1 -type f -name "${DISTRIBUTION_PREFIX}-*" -print)

          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected exactly 2 distributions for ${DISTRIBUTION_PREFIX}, found ${#files[@]}" >&2
            exit 1
          fi

          cp "${files[@]}" python/publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python/publish
