name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'fixtures/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'fixtures/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      # 自愈：main 上 fmt 漂移时自动应用并提交修复，下一段 diff 即漂移内容。
      - name: Apply rustfmt and push fixes (main only)
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "polyllm-fmt-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -am "style(rust): apply rustfmt (CI auto-fix)"
            git push
          fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
